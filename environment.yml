# Minimal environment for the initial EarthSyms 2026 analysis scripts.
# Create with:  conda env create -f environment.yml
name: mpas-earthsyms2026
channels:
  - conda-forge
dependencies:
  - python >=3.10
  - xarray
  - netcdf4
  - numpy
  - pandas
  - matplotlib
  - cartopy         # map projections/coastlines for native-mesh poster figures
  - scipy           # reading in-situ observation .mat files (scipy.io.loadmat)
  - openpyxl        # reading in-situ observation .xlsx files (LPI LiDAR)
  - pyyaml
  - dask            # lazy/chunked access to the large history datasets
